<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore the University of Pennsylvania Theta Tau alumni network by field, company, and graduating class.">
<title>Alumni Directory | Penn Theta Tau</title>
<link rel="stylesheet" href="style.css?v=directory-only">
<script defer src="directory.js?v=directory-only"></script>
</head>
<body>
<header><div class="wrap mast"><a class="brand" href="./"><span class="mark" aria-hidden="true">ΘΤ</span><span>Penn Theta Tau<small>UNIVERSITY OF PENNSYLVANIA</small></span></a><a href="https://www.upennthetatau.com/alumni">Chapter roster</a></div></header>
<main>
<section class="hero"><div class="wrap"><p class="eyebrow">THE PENN THETA TAU NETWORK</p><h1>Alumni directory</h1><p>Find alumni by what they do, where they work, or when they graduated.</p></div></section>
<section class="wrap unlock" id="unlock">
<form id="unlock-form">
<label for="password">Chapter password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Unlock directory</button>
<p id="unlock-status" role="status"></p>
</form>
</section>
<section class="wrap directory" id="directory" aria-label="Search the alumni directory" hidden>
<form id="filters" class="filters">
<label class="search">Search<input id="search" type="search" placeholder="Name, company, or experience"></label>
<label>Field<select id="field"></select></label>
<label>Company<select id="company"></select></label>
<label>Class year<select id="year"></select></label>
</form>
<div class="toolbar"><p id="count" role="status"></p><div><label for="group">Group by</label> <select id="group"><option value="">None</option><option value="field">Field</option><option value="company">Company</option><option value="year">Class year</option></select></div><button type="button" id="reset">Clear filters</button></div>
<div id="results"></div>
</section>
</main>
<dialog id="profile" aria-labelledby="profile-name">
<form method="dialog" class="profile-close"><button>Close</button></form>
<div class="card-head">
<div id="profile-avatar"></div>
<div><h2 id="profile-name"></h2><p id="profile-summary"></p></div>
</div>
<div id="profile-links"></div>
<div id="profile-content"></div>
</dialog>
<footer><div class="wrap">Penn Theta Tau · Alumni Directory</div></footer>
</body>
</html>
